<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Brainrot Learning</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <div id="auth-container" class="auth-container">
        <div class="auth-box">
            <h2>Login / Register</h2>
            <div class="tabs">

                <input type="email" id="login-email" placeholder="Email">
                <input type="password" id="login-password" placeholder="Password">
                <button id="login-btn">Login</button>
            </div>
            <div id="register-form" class="tab-content">
                <input type="text" id="register-name" placeholder="Full Name">
                <input type="email" id="register-email" placeholder="Email">
                <input type="password" id="register-password" placeholder="Password">
                <button id="register-btn">Register</button>
            </div>
        </div>
    </div>
    
    <div id="main-content" class="content hidden">
        <header>
            <h1>Chaotic Learning Environment</h1>
            <div class="user-info">
                <span id="user-name">User</span>
                <button id="logout-btn"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </header>
        
        <div class="dashboard">
            <div class="progress-container">
                <h3>Your Progress</h3>
                <div class="progress-bar">
                    <div id="progress-indicator" class="progress-indicator"></div>
                </div>
                <div class="stats">
                    <div class="stat">
                        <i class="fas fa-book"></i>
                        <span id="completed-lessons">0/10</span>
                    </div>
                    <div class="stat">
                        <i class="fas fa-clock"></i>
                        <span id="total-time">0 min</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="main-container">
            <div class="sidebar">
                <h3>Course Modules</h3>
                <ul id="module-list" class="module-list">
                    <!-- Will be populated by JavaScript 
                </ul>
            </div>
            
            <div class="lesson-container">
                <div class="text-to-speech-container">
                    <h2>Text to Speech</h2>
                    <textarea id="text-input" placeholder="Type something to convert to speech..."></textarea>
                    <div class="tts-controls">
                        <button id="speak-button"><i class="fas fa-play"></i> Speak</button>
                        <button id="pause-button"><i class="fas fa-pause"></i></button>
                        <button id="stop-button"><i class="fas fa-stop"></i></button>
                        <div class="voice-controls">
                            <select id="voice-select"></select>
                            <div class="slider-container">
                                <label for="rate">Speed:</label>
                                <input type="range" id="rate" min="0.5" max="2" value="1" step="0.1">
                                <span id="rate-value">1</span>
                            </div>
                            <div class="slider-container">
                                <label for="pitch">Pitch:</label>
                                <input type="range" id="pitch" min="0.5" max="2" value="1" step="0.1">
                                <span id="pitch-value">1</span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="learning-content">
                    <div class="lesson-header">
                        <h2 id="lesson-title">Lesson Title</h2>
                        <span id="lesson-time" class="lesson-time">5 min</span>
                    </div>
                    <div id="lesson-content" class="lesson-content">
                        <!-- Will be populated by JavaScript 
                    </div>
                    <div class="interactive-elements">
                        <div id="quiz-container" class="quiz-container hidden">
                            <h3>Quick Quiz</h3>
                            <div id="quiz-question"></div>
                            <div id="quiz-options"></div>
                            <div id="quiz-feedback"></div>
                            <button id="submit-quiz">Submit</button>
                        </div>
                    </div>
                    <div class="lesson-nav">
                        <button id="prev-lesson"><i class="fas fa-arrow-left"></i> Previous</button>
                        <button id="auto-play-lesson">
                            <i class="fas fa-headphones"></i> Auto-Play Lesson
                        </button>
                        <button id="complete-lesson">Mark as Complete</button>
                        <button id="next-lesson">Next <i class="fas fa-arrow-right"></i></button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="settings-panel" id="settings-panel">
            <h3>Settings</h3>
            <div class="setting-group">
                <label>Theme</label>
                <select id="theme-select">
                    <option value="default">Default</option>
                    <option value="dark">Dark</option>
                    <option value="neon">Neon</option>
                    <option value="pastel">Pastel</option>
                </select>
            </div>
            <div class="setting-group">
                <label>Text Size</label>
                <div class="text-size-controls">
                    <button id="text-smaller"><i class="fas fa-minus"></i></button>
                    <span id="text-size-value">Medium</span>
                    <button id="text-larger"><i class="fas fa-plus"></i></button>
                </div>
            </div>
            <div class="setting-group">
                <label>Autoplay Next Lesson</label>
                <label class="switch">
                    <input type="checkbox" id="autoplay-toggle">
                    <span class="slider round"></span>
                </label>
            </div>
            <button id="close-settings"><i class="fas fa-times"></i></button>
        </div>
        
        <footer>
            <button id="settings-btn"><i class="fas fa-cog"></i></button>
            <p>&copy; 2025 Brainrot Learning</p>
        </footer>
    </div>

    <div id="notification" class="notification"></div> -->
    <div class="video-background">
        <video autoplay muted loop id="bg-video">
          <source src="minecraft-parkour.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
      </div>
    
      <div class="content">
        <h1>Brainrot Learning</h1>
        <textarea id="text-input" placeholder="Enter text here..."></textarea>
        <button id="speak-button">Speak</button>
      </div>

    
    <script src="index.js"></script>
</body>
</html>
